<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- 土壤 -->
  <ellipse cx="24" cy="34" rx="16" ry="4" fill="#10B981" opacity="0.2"/>
  <line x1="8" y1="34" x2="40" y2="34" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 种子（部分露出） -->
  <ellipse cx="24" cy="32" rx="4" ry="3" fill="#059669"/>
  
  <!-- 嫩芽主茎（更长，生长状态） -->
  <path d="M 24 32 Q 24 26, 24 18" stroke="url(#stemGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 左叶（更大） -->
  <path d="M 24 24 Q 18 20, 14 22 Q 18 24, 24 24" 
        fill="url(#leafGradient)" stroke="#059669" stroke-width="1"/>
  <path d="M 20 22 Q 22 22, 24 24" stroke="#86EFAC" stroke-width="0.5" opacity="0.6"/>
  
  <!-- 右叶（更大） -->
  <path d="M 24 26 Q 30 22, 34 24 Q 30 26, 24 26" 
        fill="url(#leafGradient)" stroke="#059669" stroke-width="1"/>
  <path d="M 28 24 Q 26 24, 24 26" stroke="#86EFAC" stroke-width="0.5" opacity="0.6"/>
  
  <!-- 顶部新叶（展开） -->
  <path d="M 24 18 Q 22 16, 20 18" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 24 18 Q 26 16, 28 18" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 光晕效果 -->
  <circle cx="24" cy="20" r="10" fill="#10B981" opacity="0.1"/>
</svg>
