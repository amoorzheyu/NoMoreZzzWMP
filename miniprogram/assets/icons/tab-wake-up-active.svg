<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 地平线 -->
  <line x1="4" y1="32" x2="44" y2="32" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 云朵 1 -->
  <path d="M8 30 Q 10 28, 12 30" stroke="#FFB347" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 云朵 2 -->
  <path d="M36 28 Q 38 26, 40 28" stroke="#FFB347" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 太阳（完整圆形，升起状态） -->
  <defs>
    <linearGradient id="sunGradientActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- 光晕 -->
  <circle cx="24" cy="28" r="16" fill="url(#sunGlow)"/>
  
  <!-- 太阳主体 -->
  <circle cx="24" cy="28" r="10" fill="url(#sunGradientActive)"/>
  
  <!-- 高光 -->
  <ellipse cx="20" cy="25" rx="3" ry="4" fill="#FFE4B5" opacity="0.6"/>
  
  <!-- 光芒（更多、更长） -->
  <g opacity="0.8">
    <line x1="24" y1="14" x2="24" y2="10" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="18" x2="38" y2="14" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="18" x2="10" y2="14" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="28" x2="42" y2="28" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="6" y2="28" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
